services:
  magda-crete:
    build: .
    container_name: magda-crete
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
      # Poświadczenia Claude Code CLI z hosta: `claude` logowany raz na serwerze,
      # kontener korzysta z tej samej sesji zamiast własnego tokenu.
      - /root/.claude:/root/.claude
